  <marker id="mk-s" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="currentColor"/>
  </marker>
</defs>

<!-- temporal pipeline -->
<rect x="14" y="14" width="236" height="200" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
<text x="132" y="34" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.7">Temporal pipeline</text>

<rect x="32" y="48" width="200" height="44" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="132" y="74" text-anchor="middle" font-size="11" fill="currentColor">ingest match video</text>
<line x1="132" y1="92" x2="132" y2="104" stroke="currentColor" stroke-width="1" marker-end="url(#mk-s)"/>

<rect x="32" y="104" width="200" height="44" fill="none" stroke="var(--accent)" stroke-width="2"/>
<text x="132" y="124" text-anchor="middle" font-size="11" fill="currentColor">DistributedJobWorkflow</text>
<text x="132" y="140" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">submits · watches · reconciles</text>
<line x1="132" y1="148" x2="132" y2="160" stroke="currentColor" stroke-width="1" marker-end="url(#mk-s)"/>

<rect x="32" y="160" width="200" height="44" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="132" y="186" text-anchor="middle" font-size="11" fill="currentColor">publish analytics</text>

<!-- submit out, status back -->
<line x1="232" y1="120" x2="310" y2="120" stroke="currentColor" stroke-width="1" marker-end="url(#mk-s)"/>
<text x="271" y="112" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.75">submits</text>
<line x1="310" y1="140" x2="232" y2="140" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" marker-end="url(#mk-s)"/>
<text x="271" y="156" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.65">status</text>

<rect x="310" y="100" width="160" height="56" fill="none" stroke="currentColor" stroke-width="1"/>

<text x="390" y="142" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.6">queues · admission</text>

<!-- placement fan -->
<line x1="470" y1="128" x2="483" y2="128" stroke="currentColor" stroke-width="1"/>
<line x1="483" y1="75" x2="483" y2="223" stroke="currentColor" stroke-width="1"/>
<line x1="483" y1="75" x2="508" y2="75" stroke="currentColor" stroke-width="1" marker-end="url(#mk-s)"/>
<line x1="483" y1="149" x2="508" y2="149" stroke="currentColor" stroke-width="1" marker-end="url(#mk-s)"/>
<line x1="483" y1="223" x2="508" y2="223" stroke="currentColor" stroke-width="1" marker-end="url(#mk-s)"/>

<!-- cloud regions -->
<rect x="496" y="14" width="160" height="250" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" opacity="0.45"/>
<text x="576" y="32" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.6">cloud · multi-region</text>

<rect x="508" y="44" width="136" height="62" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="576" y="67" text-anchor="middle" font-size="10.5" fill="currentColor">region · EU</text>
<text x="576" y="83" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">GPU node pool</text>

<rect x="508" y="118" width="136" height="62" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="576" y="141" text-anchor="middle" font-size="10.5" fill="currentColor">region · US</text>
<text x="576" y="157" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">GPU node pool</text>

<rect x="508" y="192" width="136" height="62" fill="none" stroke="currentColor" stroke-width="1"/>
<text x="576" y="215" text-anchor="middle" font-size="10.5" fill="currentColor">region · APAC</text>
<text x="576" y="231" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">GPU node pool</text>
        </svg>
<figcaption>The distributed job execution engine. A child workflow inside the Temporal pipeline owns the job's whole life: it submits, then watches until completion, so a lost node is the workflow's problem to retry rather than a silently dropped job. Kueue admits work against quota and places it on whichever region has GPU capacity — which is what keeps expensive accelerators busy instead of overprovisioned per region.</figcaption>
</figure>
