{{ define "main" }}
<section class="page">
  <div class="section-head">
    <span class="eyebrow">Writing</span>
    <h1>{{ .Title }}</h1>
    {{- with .Description }}
    <p>{{ . }}</p>
    {{- end }}
  </div>
  <ul class="post-list">
    {{- range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time></li>
    {{- end }}
  </ul>
</section>
{{ end }}
