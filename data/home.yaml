about:
  eyebrow: About
  title: Engineer, architect, brevet rider
  bio:
    - >-
      I'm a software engineer and architect based in Warsaw, Poland — originally from Minsk, Belarus, with a
      degree in Electronics from the Belarusian National Technical University (BNTU). Over more than a decade
      in the industry, I've kept circling back to the
      same kind of work: taking something from "someone's idea" to "a platform that actually runs in
      production" — usually for startups, almost always with open source somewhere in the foundation.
    - >-
      I like moving fast without cutting corners that come back to bite you later — durable-execution engines
      instead of duct tape, multitenancy designed in instead of bolted on, infrastructure that's boring in the
      right ways. Lately that also means bringing AI into the loop properly: not as a demo, but as something a
      platform is actually built around.
    - >-
      Outside of work: family, a daughter, a dog, and long-distance cycling — brevets, mostly, which is its
      own lesson in pacing yourself for the long haul.
  facts:
    - label: Based in
      value: Warsaw, Poland
    - label: From
      value: Minsk, Belarus
    - label: Education
      value: Electronics, Belarusian National Technical University
    - label: In the industry
      value: 10+ years
    - label: Off the clock
      value: brevets, family, an Australian shepherd

